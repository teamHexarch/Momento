# Run on the dedicated moderation machine with access to the same private S3 bucket and MongoDB.
services:
  models:
    build:
      context: ..
      dockerfile: moderation/Dockerfile
    restart: unless-stopped
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20m
    environment:
      FALCONSAI_REVISION: ${FALCONSAI_REVISION:?Set the calibrated model commit}
      QWEN_REVISION: ${QWEN_REVISION:?Set the calibrated model commit}
    volumes:
      - model-cache:/cache
  worker:
    build: ..
    restart: unless-stopped
    init: true
    command: ["node", "scripts/moderationWorker.js"]
    healthcheck:
      disable: true
    network_mode: service:models
    depends_on:
      models:
        condition: service_healthy
    env_file: /opt/momento-config/server.env
    environment:
      NSFW_PIPELINE: three-stage
      NSFW_CALIBRATION: /config/calibration.json
      NSFW_MODEL_URL: http://127.0.0.1:8071
    volumes:
      - /opt/momento-config/calibration.json:/config/calibration.json:ro
volumes:
  model-cache:
