# The website's smoke test (Client/e2e): a guest joins an event with its link, uploads a photo, sees it and reacts,
# on a desktop and a phone screen, against the real server code on a throwaway database (never production).
# Runs on every pull request that touches the site or the server, and before every publish (pages.yml waits for it).
name: Website tests

on:
  pull_request:
    paths: ['Client/**', 'Server/**', '.github/workflows/website-tests.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The test database program (about 800 MB), downloaded once and kept between runs
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Client/package-lock.json
            Server/package-lock.json

      - uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('Server/package-lock.json') }}

      - name: Install the server (its code runs the test API)
        working-directory: Server
        run: npm ci --no-audit --no-fund

      - name: Build the site
        working-directory: Client
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install the test browser
        working-directory: Client
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: Client
        run: npm run test:e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: Client/e2e/.run/
          retention-days: 7
