# Momento API on one AWS Lightsail server: the API in a container, with Caddy in front for HTTPS
# (free Let's Encrypt certificates that renew themselves). See "Moving the API to AWS" in README.md.
# Run by deploy/update.sh; settings come from /opt/momento-config/server.env (never in Git).
services:
  api:
    build: ..
    restart: unless-stopped
    # A small init process passes stop signals on to Node, and an update waits up to 30 s for requests in
    # progress (uploads) to finish before stopping the old container (src/server.js stops cleanly in 25 s)
    init: true
    stop_grace_period: 30s
    # Memory ceiling (audit B6): if a burst of huge photos ever needs more, only this container is restarted
    # (restart: unless-stopped), instead of the whole 4 GB server freezing with Caddy and SSH. 3 GB leaves room for
    # Caddy and the system; on a different size of server, export API_MEM_LIMIT (e.g. 700m on 1 GB) before updating.
    mem_limit: ${API_MEM_LIMIT:-3g}
    memswap_limit: ${API_MEMSWAP_LIMIT:-4g}
    env_file: /opt/momento-config/server.env
    environment:
      NODE_ENV: production
      PORT: '8080'
      # Caddy is the one proxy in front of the API
      TRUST_PROXY: '1'
    expose:
      - '8080'
    # Read-only settings folder, e.g. NSFW_CALIBRATION=/config/calibration.json
    # (put the file in /opt/momento-config/calibration.json on the server)
    volumes:
      - /opt/momento-config:/config:ro
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    mem_limit: 256m
    depends_on: [api]
    ports:
      - '80:80'
      - '443:443'
    environment:
      # The address(es) this server answers on, e.g. "api.hexarch.org" (set in /opt/momento-config/domains)
      API_DOMAINS: ${API_DOMAINS:-api.hexarch.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  caddy_data:
  caddy_config:
