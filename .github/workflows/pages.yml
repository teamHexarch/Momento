# Publishes the Client folder to https://hexarch.org (GitHub Pages) on every push that
# changes it. Only the files the site needs are published; design-time files in Client/
# (CLAUDE.md, serve.mjs) stay in the repo but aren't served.
# assets/devpreview.js (local dev mode) is removed from the published files.
#
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
# To publish again without changing anything: GitHub > Actions > Publish site > Run workflow.

name: Publish site

on:
  push:
    branches: [main]
    paths: ['Client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the public site files
        run: |
          mkdir -p _site
          cp Client/index.html Client/albums.html Client/settings.html Client/support.html Client/events.html Client/groups.html Client/privacy.html Client/terms.html Client/review.html Client/404.html Client/sw.js Client/CNAME Client/manifest.webmanifest Client/favicon.ico _site/
          # The whole assets folder (scripts, styles, translations, icons, the link preview picture, the globe
          # and the site's own photos), so a new kind of file there is never left off the live site
          cp -r Client/assets _site/assets
          rm -f _site/assets/devpreview.js
          ls -R _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
