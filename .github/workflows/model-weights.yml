name: Verify moderation weights
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-weights.yml'
      - 'Server/moderation/models.py'
      - 'Server/moderation/requirements.txt'
      - 'Server/src/services/moderationReadiness.js'
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FALCONSAI_REVISION: 96cb0d0342c7afb80cab76ecc58b265fa44da256
      QWEN_REVISION: cc594898137f460bfe9f0759e9844b3ce807cfb5
      HF_HUB_DISABLE_XET: '1'
      MODEL_CPU_THREADS: '4'
      JWT_SECRET: isolated-ci-smoke
      MONGODB_URI: mongodb://127.0.0.1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare disposable runner for full model weights
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
          sudo fallocate -l 8G /mnt/momento-model-swap
          sudo chmod 600 /mnt/momento-model-swap
          sudo mkswap /mnt/momento-model-swap
          sudo swapon /mnt/momento-model-swap
          df -h .
      - name: Install inference runtimes
        working-directory: Server
        run: |
          npm ci --omit=dev --no-audit --no-fund
          pip install --no-cache-dir torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r moderation/requirements.txt
      - name: Load pinned models and classify a fixture at all three stages
        working-directory: Server
        run: |
          python -u moderation/models.py &
          model_pid=$!
          trap 'kill "$model_pid" 2>/dev/null || true' EXIT
          until curl -fs --max-time 2 http://127.0.0.1:8071/ready; do
            kill -0 "$model_pid" || { wait "$model_pid"; exit 1; }
            sleep 5
          done
          node --input-type=module -e "import {verifyModerationModels} from './src/services/moderationReadiness.js'; await verifyModerationModels()"
