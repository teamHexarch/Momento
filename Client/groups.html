  <script>
    // This page has no intro of its own
    document.documentElement.classList.remove('intro-on');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finePointer = matchMedia('(pointer: fine)').matches;
    const root = document.documentElement;
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
    const easeOut = (v) => 1 - Math.pow(1 - v, 3);
    const OUT = 'cubic-bezier(.16, 1, .3, 1)';

    // ---- Shared pointer state and cursor ----
    const pointer = { x: innerWidth / 2, y: innerHeight / 2, active: false, ix: 0, iy: 0 };
    let vw = innerWidth, vh = innerHeight;
    addEventListener('resize', () => { vw = innerWidth; vh = innerHeight; });
    const cursorEl = document.getElementById('cursor');
    const useCursor = finePointer && !still;
    // The dot starts where the mouse was on the last page (clicking a link doesn't move the mouse),
    // not in the middle of the screen. Until the mouse has been seen, the dot stays hidden and the
    // normal pointer shows
    try {
      const at = JSON.parse(sessionStorage.getItem('momento-pointer') || 'null');
      if (at && Date.now() - at.t < 15000 && at.x <= innerWidth && at.y <= innerHeight) {
        pointer.x = at.x; pointer.y = at.y;
        document.documentElement.classList.add('cursor-seen');
      }
    } catch (e) {}
    addEventListener('pagehide', () => {
      try { if (document.documentElement.classList.contains('cursor-seen')) sessionStorage.setItem('momento-pointer', JSON.stringify({ x: pointer.x, y: pointer.y, t: Date.now() })); } catch (e) {}
    });
    let rx = pointer.x, ry = pointer.y;
    if (useCursor) root.classList.add('has-cursor');
    // Touch, a pen, or Chrome's mobile preview (switched on without a reload) send no mouse moves
    // between taps, so the bead would sit stuck beside the real touch point. Hide it and give the
    // normal pointer back until a mouse moves again.
    {
      const fineMq = matchMedia('(pointer: fine)'), rootCl = document.documentElement.classList;
      const sync = (e) => {
        rootCl.toggle('cursor-off', !fineMq.matches || (!!e && e.pointerType !== 'mouse'));
        if (e && e.pointerType === 'mouse') rootCl.add('cursor-seen');
      };
      addEventListener('pointermove', sync, { passive: true, capture: true });
      addEventListener('pointerdown', sync, { passive: true, capture: true });
      fineMq.addEventListener('change', () => sync());
    }
    addEventListener('pointermove', (e) => {
      if (pointer.active) { pointer.ix += e.clientX - pointer.x; pointer.iy += e.clientY - pointer.y; }
      else { rx = e.clientX; ry = e.clientY; }
      pointer.x = e.clientX; pointer.y = e.clientY;
      pointer.active = true;
      if (useCursor) {
        const el = e.target instanceof Element ? e.target : null;
        root.classList.toggle('cursor-hover', !!el?.closest('a, button, input, .live-media'));
      }
    }, { passive: true });
    root.addEventListener('pointerleave', () => { pointer.active = false; });
    addEventListener('pointerdown', () => root.classList.add('cursor-down'));
    addEventListener('pointerup', () => root.classList.remove('cursor-down'));

    // ---- Living background: the same silk shader as the landing page ----
    const canvas = document.getElementById('bg');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'low-power' });
    // The silk is soft, so it is drawn into a small buffer (about 60k pixels on any screen) that the
    // browser scales up smoothly. That is cheap enough to redraw every frame, so the drift stays fluid
    const SILK_PIXELS = 60000;
    const flow = { t: 0, scroll: scrollY, dirty: true, acc: 0 };
    let renderFluid = () => {};
    if (gl) {
      const vert = 'attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }';
      const frag = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform vec2 res;
        uniform float t;
        uniform float sc;     // scroll offset
        uniform vec3 c0, c1, c2, c3;   // the palette: fog, folds, sea glass, glints (eased between light and dark)
        // Stable hash (no sin), so the noise doesn't break into blocks at lower precision
        float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        float fbm(vec2 p) {
          float s = 0.0, a = 0.5;
          for (int i = 0; i < 3; i++) { s += a * noise(p); p = p * 2.02 + vec2(1.7, 9.2); a *= 0.5; }
          return s;
        }
        void main() {
          vec2 uv = gl_FragCoord.xy / res;
          float asp = res.x / res.y;
          vec2 p = vec2(uv.x * asp, 1.0 - uv.y);
          p.y += sc;
          p *= 1.25;
          // Domain warping folds the noise into large soft ridges, like draped silk
          vec2 q = vec2(fbm(p + vec2(0.0, t * 0.05)), fbm(p + vec2(5.2, 1.3) - t * 0.04));
          vec2 r = vec2(fbm(p + 3.4 * q + vec2(1.7, 9.2) + t * 0.06), fbm(p + 3.4 * q + vec2(8.3, 2.8) - t * 0.05));
          float f = fbm(p + 3.2 * r);
          vec3 col = mix(c0, c1, smoothstep(0.46, 0.74, f));
          col = mix(col, c2, smoothstep(0.62, 0.95, q.y) * 0.3);
          // Soft cream light where the folds turn over
          float edge = exp(-pow((f - 0.44) * 24.0, 2.0)) + 0.7 * exp(-pow((r.x - 0.6) * 20.0, 2.0)) + 0.5 * exp(-pow((f - 0.6) * 26.0, 2.0));
          col = mix(col, c3, clamp(edge * 0.85 + smoothstep(0.36, 0.2, f) * 0.4, 0.0, 1.0));
          gl_FragColor = vec4(col, 1.0);
        }`;
      const prog = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vert], [gl.FRAGMENT_SHADER, frag]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        gl.attachShader(prog, s);
      }
      gl.bindAttribLocation(prog, 0, 'a');
      gl.linkProgram(prog);
      if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        const u = {};
        for (const name of ['res', 't', 'sc', 'c0', 'c1', 'c2', 'c3']) u[name] = gl.getUniformLocation(prog, name);
        // Pale blue fog, lavender-blue folds, sea glass and cream edges by day; by night the same
        // silk goes near-black, with the glints turning to moonlit lavender
        const PAL = {
          light: [[.905, .918, .955], [.740, .775, .880], [.790, .865, .870], [1, .975, .925]],
          dark:  [[.046, .042, .072], [.020, .018, .034], [.052, .062, .108], [.175, .152, .280]],
        };
        // The folds and fog darken first; the glints warm up a beat later, like lamps coming on
        const THEME = window.__theme || (window.__theme = { target: 0, a: 0, b: 0 });
        const mixPal = (i, m) => PAL.light[i].map((v, c) => v + (PAL.dark[i][c] - v) * m);
        const sizeCanvas = () => {
          const s = Math.min(.25, Math.sqrt(SILK_PIXELS / Math.max(1, innerWidth * innerHeight)));
          canvas.width = Math.max(1, Math.round(innerWidth * s));
          canvas.height = Math.max(1, Math.round(innerHeight * s));
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(u.res, canvas.width, canvas.height);
          flow.dirty = true;
        };
        sizeCanvas();
        // Resizing reallocates the buffer, so it waits until the window has settled
        let resizeTimer = 0;
        addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(sizeCanvas, 150); });
        renderFluid = (dt) => {
          const k = (rate) => 1 - Math.exp(-dt * rate);
          const before = flow.scroll;
          flow.scroll += (scrollY - flow.scroll) * k(5);
          if (Math.abs(scrollY - flow.scroll) < .5) flow.scroll = scrollY;
          if (!still) flow.t += dt * 0.6;
          // Ease toward the chosen theme (instantly with reduced motion)
          const fade = still ? 1 : k(3.2), glow = still ? 1 : k(1.5);
          const settling = Math.abs(THEME.target - THEME.a) > .002 || Math.abs(THEME.target - THEME.b) > .002;
          if (settling) {
            THEME.a += (THEME.target - THEME.a) * fade; THEME.b += (THEME.target - THEME.b) * glow;
            if (Math.abs(THEME.target - THEME.a) <= .002) THEME.a = THEME.target;
            if (Math.abs(THEME.target - THEME.b) <= .002) THEME.b = THEME.target;
            flow.dirty = true;
          }
          if (still && flow.scroll === before && !flow.dirty) return;
          // Every frame up to about 75 a second; faster screens (120 Hz and up) draw every other frame
          flow.acc += dt;
          if (!flow.dirty && flow.acc < 1 / 75) return;
          flow.acc = 0; flow.dirty = false;
          gl.uniform1f(u.t, flow.t);
          gl.uniform1f(u.sc, flow.scroll / vh * 0.35);
          gl.uniform3fv(u.c0, mixPal(0, THEME.a)); gl.uniform3fv(u.c1, mixPal(1, THEME.a));
          gl.uniform3fv(u.c2, mixPal(2, THEME.a)); gl.uniform3fv(u.c3, mixPal(3, THEME.b));
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };
      }
    }

    // ---- Glass rim light follows the pointer ----
    function lightUp(glass) {
      glass.addEventListener('pointerenter', () => glass.style.setProperty('--shine', 1));
      glass.addEventListener('pointerleave', () => glass.style.setProperty('--shine', 0));
      glass.addEventListener('pointermove', (e) => {
        const r = glass.getBoundingClientRect();
        glass.style.setProperty('--mx', `${e.clientX - r.left}px`);
        glass.style.setProperty('--my', `${e.clientY - r.top}px`);
      });
    }
    document.querySelectorAll('.glass, .panel').forEach((g) => { if (!g.closest('.album')) lightUp(g); });

    // ---- Buttons: fill floods in from where the cursor enters, label rolls, slight pull ----
    function rollButton(btn) {
      if (btn.querySelector('.btn-fill')) return;
      const inner = btn.innerHTML.trim();
      btn.innerHTML = `<span class="btn-fill" aria-hidden="true"></span><span class="btn-label"><span class="roll"><span>${inner}</span><span aria-hidden="true">${inner}</span></span></span>`;
      const origin = (e) => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty('--fx', `${e.clientX - r.left}px`);
        btn.style.setProperty('--fy', `${e.clientY - r.top}px`);
      };
      btn.addEventListener('pointerenter', origin);
      btn.addEventListener('pointerleave', (e) => { origin(e); btn.style.setProperty('--bx', '0px'); btn.style.setProperty('--by', '0px'); });
      if (useCursor) btn.addEventListener('pointermove', (e) => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty('--bx', `${(e.clientX - r.left - r.width / 2) * .18}px`);
        btn.style.setProperty('--by', `${(e.clientY - r.top - r.height / 2) * .3}px`);
      });
    }
    document.querySelectorAll('.btn').forEach(rollButton);

    // ---- Nav: Home goes to the home page; the arrow (or hovering) opens its sections ----
    (() => {
      const wrap = document.getElementById('navWrap');
      const split = wrap.querySelector('.nav-split');
      const caret = wrap.querySelector('.nav-caret');
      const menu = document.getElementById('navMenu');
      let open = false, timer;
      const setOpen = (v) => {
        clearTimeout(timer);
        if (v === open) return;
        open = v;
        menu.classList.toggle('is-open', v);
        caret.setAttribute('aria-expanded', v);
      };
      caret.addEventListener('click', () => setOpen(!open));
      if (finePointer) for (const zone of [split, menu]) {
        zone.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') setOpen(true); });
        zone.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') timer = setTimeout(() => setOpen(false), 260); });
      }
      document.addEventListener('pointerdown', (e) => { if (open && !wrap.contains(e.target)) setOpen(false); });
      addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { setOpen(false); caret.focus(); } });
    })();

    // ---- Friend groups ----
    // Make a group, invite friends by email, accept or decline invites, and browse each group's albums.
    // Being in a group is what gives access to its albums: the server checks it on every album and photo.
    (() => {
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const plural = (n, one, many) => `${n.toLocaleString('en-GB')} ${n === 1 ? one : many}`;
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const FACES = ['#D9D0EA', '#E6CDD6', '#C9DEDB', '#EADCC8', '#D3DCEE'];
      const statusEl = $('grStatus'), body = $('grBody');
      const say = (t, bad) => { statusEl.textContent = t || ''; statusEl.classList.toggle('is-error', !!bad); };
      const ICON = {
        mail: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>',
        plus: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
        chev: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
      };

      let groups = [], invites = [];
      const open = new Set();   // groups whose people list is open, kept across redraws
      const chatOpen = new Set();   // groups whose chat is open, kept across redraws
      const chats = new Map();      // group id -> its loaded messages, kept across redraws

      const initials = (name) => (name === 'You' ? 'You' : String(name).trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?');
      const hue = (id) => FACES[[...String(id)].reduce((t, c) => t + c.charCodeAt(0), 0) % FACES.length];
      const face = (m, i = 0) => `<span class="grc-face${m.you ? ' is-you' : ''}" style="--c: ${hue(m.id)}; --z: ${9 - i}" title="${esc(m.name)}">${m.avatarUrl ? `<img src="${esc(m.avatarUrl)}" alt="">` : esc(initials(m.name))}</span>`;
      const dateOf = (a) => new Date(a.date + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

      async function load(quiet) {
        try {
          ({ groups, invites } = await momentoApi('/api/groups'));
          if (!quiet) say('');
        } catch (err) {
          say(err.message, true);
          return;
        }
        render();
      }

      function render() {
        body.removeAttribute('aria-busy');
        body.textContent = '';
        if (invites.length) {
          const sec = document.createElement('section');
          sec.className = 'gr-invites';
          sec.setAttribute('aria-labelledby', 'grInvitesTitle');
          sec.innerHTML = `<h2 class="gr-h2" id="grInvitesTitle">${invites.length === 1 ? 'An invite for you' : 'Invites for you'}</h2>`;
          for (const i of invites) sec.append(inviteCard(i));
          body.append(sec);
        }
        if (!groups.length) {
          const empty = document.createElement('div');
          empty.className = 'gr-empty panel';
          empty.innerHTML = `
            <h2>Start a group for the friends you see most</h2>
            <p>Make a group, invite your friends by email, then share albums with it. Everyone who joins sees every album the group shares, including ones added later.</p>
            <button class="btn btn-dark" type="button" data-new>Make a group</button>`;
          empty.querySelector('[data-new]').addEventListener('click', (e) => newGroup(e.currentTarget));
          body.append(empty);
        } else {
          if (invites.length) body.insertAdjacentHTML('beforeend', '<h2 class="gr-h2">Your groups</h2>');
          for (const g of groups) body.append(groupCard(g));
        }
        body.querySelectorAll('.btn').forEach(rollButton);
        body.querySelectorAll('.panel').forEach(lightUp);
      }

      // ---- An invite waiting for you ----
      function inviteCard(i) {
        const el = document.createElement('article');
        el.className = 'gri panel';
        el.innerHTML = `
          <i class="gri-ic" aria-hidden="true">${ICON.mail}</i>
          <p class="gri-text"><b>${esc(i.by)}</b> invited you to <b>${esc(i.group.name)}</b><small>${plural(i.members, 'person', 'people')} in it, ${plural(i.albums, 'shared album', 'shared albums')}</small></p>
          <div class="gri-acts"><button class="btn btn-light" type="button" data-no>Decline</button><button class="btn btn-dark" type="button" data-yes>Join group</button></div>`;
        el.querySelector('[data-yes]').addEventListener('click', async (e) => {
          e.currentTarget.disabled = true;
          try {
            const { group } = await momentoApi(`/api/groups/invites/${encodeURIComponent(i.id)}/accept`, { method: 'POST' });
            Momento.toast(`You joined ${group.name}`, group.albums.length ? `${plural(group.albums.length, 'album', 'albums')} added to My albums` : 'Albums shared with it will show up here');
            open.add(group.id);
            await load();
          } catch (err) { e.currentTarget.disabled = false; Momento.toast('Couldn’t join the group', err.message); }
        });
        el.querySelector('[data-no]').addEventListener('click', async (e) => {
          const ok = await Momento.confirm({ from: e.currentTarget, title: `Decline the invite to ${i.group.name}?`, body: `${i.by} can invite you again later.`, ok: 'Decline', danger: false });
          if (!ok) return;
          try {
            await momentoApi(`/api/groups/invites/${encodeURIComponent(i.id)}/decline`, { method: 'POST' });
            Momento.toast('Invite declined', i.group.name);
            await load();
          } catch (err) { Momento.toast('Couldn’t decline the invite', err.message); }
        });
        return el;
      }

      // ---- A group: faces, name, its albums, then its people ----
      function groupCard(g) {
        const owner = g.role === 'owner';
        const el = document.createElement('article');
        el.className = 'grc panel';
        el.dataset.id = g.id;
        el.setAttribute('aria-labelledby', `grName-${g.id}`);
        const shown = g.members.slice(0, 5);
        const more = g.members.length - shown.length;
        const albums = g.albums.map((a) => `
          <a class="gra" href="albums.html#album=${encodeURIComponent(a.id)}" aria-label="${esc(a.name)}, ${esc(dateOf(a))}, ${plural(a.photos, 'photo', 'photos')}">
            <span class="gra-pic">${a.pics?.[0] ? `<img src="${esc(a.pics[0])}" alt="" loading="lazy">` : '<span class="gra-none">No photos yet</span>'}${a.live ? '<span class="gra-live"><i></i>Live</span>' : ''}</span>
            <b>${esc(a.name)}</b>
            <small>${esc(dateOf(a))}, ${plural(a.photos, 'photo', 'photos')}</small>
            <small>${a.hostIsYou ? 'You’re hosting' : `Host: ${esc(a.hostName)}`}</small>
          </a>`).join('');
        const people = g.members.map((m) => `
          <li>${face(m, 0)}<span class="grc-who"><b>${esc(m.name)}</b><small>${m.role === 'owner' ? 'Made the group' : `Joined ${new Date(m.since).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`}</small></span>
            ${owner && !m.you ? `<button class="grc-link is-danger" type="button" data-remove="${esc(m.id)}" data-name="${esc(m.name)}">Remove</button>` : ''}</li>`).join('');
        const waiting = g.invites.map((i) => `
          <li><span class="grc-face is-waiting" aria-hidden="true">${ICON.mail}</span><span class="grc-who"><b>${esc(i.email)}</b><small>Invited by ${esc(i.by)}, hasn’t joined yet</small></span>
            ${i.canCancel ? `<button class="grc-link" type="button" data-cancel="${esc(i.id)}" data-email="${esc(i.email)}">Take back</button>` : ''}</li>`).join('');
        el.innerHTML = `
          <div class="grc-top">
            <span class="grc-faces" aria-hidden="true">${shown.map((m, i) => face(m, i)).join('')}${more > 0 ? `<span class="grc-face is-more">+${more}</span>` : ''}</span>
            <div class="grc-name">
              <h2 id="grName-${esc(g.id)}">${esc(g.name)}</h2>
              <p>${plural(g.members.length, 'person', 'people')}, ${plural(g.albums.length, 'shared album', 'shared albums')}${owner ? '. You made it' : ''}</p>
            </div>
            <div class="grc-acts">
              <button class="btn btn-light" type="button" data-create data-create-group="${esc(g.id)}">Add an album</button>
              <button class="btn btn-dark" type="button" data-invite>Invite a friend</button>
            </div>
          </div>
          <div class="grc-albums" aria-label="Albums shared with ${esc(g.name)}">
            ${albums}
            <button class="gra-add" type="button" data-create data-create-group="${esc(g.id)}">${ICON.plus}${g.albums.length ? 'Share another album' : 'Share the first album with this group'}</button>
          </div>
          <details class="grc-people"${open.has(g.id) ? ' open' : ''}>
            <summary>People in ${esc(g.name)}${g.invites.length ? `, ${g.invites.length} invited` : ''} ${ICON.chev}</summary>
            <ul class="grc-list">${people}${waiting}</ul>
            <div class="grc-foot">
              ${owner
                ? '<button class="grc-link" type="button" data-rename>Rename group</button><button class="grc-link is-danger" type="button" data-delete>Delete group</button>'
                : '<button class="grc-link is-danger" type="button" data-leave>Leave group</button>'}
            </div>
          </details>
          <details class="grc-people grc-chat"${chatOpen.has(g.id) ? ' open' : ''}>
            <summary>Group chat ${ICON.chev}</summary>
            <div class="grc-msgs" role="log" aria-live="polite" aria-label="Messages in ${esc(g.name)}"></div>
            <form class="grc-say">
              <label class="grc-say-label" for="grSay-${esc(g.id)}">Message ${esc(g.name)}</label>
              <textarea id="grSay-${esc(g.id)}" name="text" rows="1" maxlength="1000" placeholder="Message ${esc(g.name)}" required></textarea>
              <button class="btn btn-dark" type="submit">Send</button>
            </form>
          </details>`;
        el.querySelector('details').addEventListener('toggle', (e) => { if (e.currentTarget.open) open.add(g.id); else open.delete(g.id); });
        setUpChat(g, el.querySelector('.grc-chat'));
        el.querySelector('[data-invite]').addEventListener('click', (e) => invite(g, e.currentTarget));
        el.querySelector('[data-rename]')?.addEventListener('click', (e) => rename(g, e.currentTarget));
        el.querySelector('[data-delete]')?.addEventListener('click', (e) => removeGroup(g, e.currentTarget));
        el.querySelector('[data-leave]')?.addEventListener('click', (e) => leave(g, e.currentTarget));
        el.querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', () => removeMember(g, b)));
        el.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => cancelInvite(g, b)));
        return el;
      }

      // ---- The group chat ----
      // Messages are fetched when a chat is opened, then every 8 seconds while it's open and the
      // page is visible. The server checks membership on every read and send.
      const timeOf = (at) => new Date(at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
      function setUpChat(g, box) {
        const list = box.querySelector('.grc-msgs'), form = box.querySelector('form'), field = form.elements.text;
        const state = chats.get(g.id) || { messages: [], more: false };
        chats.set(g.id, state);
        const draw = (stick) => {
          const near = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
          list.innerHTML = (state.more ? '<button class="grc-link grc-older" type="button">Show earlier messages</button>' : '')
            + state.messages.map((m) => `<div class="grc-msg${m.you ? ' is-you' : ''}">${m.you ? '' : `<b>${esc(m.by)}</b>`}<p>${esc(m.text)}</p><small>${esc(timeOf(m.at))}</small></div>`).join('');
          list.querySelector('.grc-older')?.addEventListener('click', older);
          if (stick || near) list.scrollTop = list.scrollHeight;
        };
        const url = `/api/groups/${encodeURIComponent(g.id)}/messages`;
        async function fetchNew(first) {
          try {
            const r = await momentoApi(url);
            const before = state.messages.at(-1)?.id;
            // Keep earlier pages already loaded; replace the newest 50
            const ids = new Set(r.messages.map((m) => m.id));
            const keep = state.messages.filter((m) => !ids.has(m.id) && (!r.messages[0] || m.at < r.messages[0].at));
            state.messages = [...keep, ...r.messages];
            if (first) state.more = r.more;
            if (first || state.messages.at(-1)?.id !== before) draw(first);
          } catch (err) {
            if (err.status === 404) { stop(); load(true); }   // no longer in the group
          }
        }
        async function older() {
          const first = state.messages[0];
          if (!first) return;
          try {
            const r = await momentoApi(`${url}?before=${encodeURIComponent(first.at)}`);
            state.messages = [...r.messages, ...state.messages];
            state.more = r.more;
            const h = list.scrollHeight;
            draw(false);
            list.scrollTop += list.scrollHeight - h;
          } catch (err) { Momento.toast('Couldn’t load earlier messages', err.message); }
        }
        let timer = 0;
        const stop = () => { clearInterval(timer); timer = 0; };
        const start = () => {
          stop();
          fetchNew(true);
          timer = setInterval(() => { if (!document.hidden && box.isConnected && box.open) fetchNew(false); else if (!box.isConnected) stop(); }, 8000);
        };
        box.addEventListener('toggle', () => {
          if (box.open) { chatOpen.add(g.id); start(); field.focus({ preventScroll: true }); }
          else { chatOpen.delete(g.id); stop(); }
        });
        if (box.open) { draw(true); start(); }
        // Enter sends; Shift+Enter makes a new line. The box grows with the text
        field.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
        field.addEventListener('input', () => { field.style.height = 'auto'; field.style.height = Math.min(field.scrollHeight, 128) + 'px'; });
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const text = field.value.trim();
          if (!text) return;
          const btn = form.querySelector('button');
          btn.disabled = true;
          try {
            const { message } = await momentoApi(url, momentoJson('POST', { text }));
            state.messages.push(message);
            field.value = ''; field.style.height = '';
            draw(true);
          } catch (err) { Momento.toast('Couldn’t send the message', err.message); }
          finally { btn.disabled = false; field.focus({ preventScroll: true }); }
        });
      }

      // ---- Actions ----
      async function newGroup(from) {
        const name = await Momento.ask({
          from, title: 'New friend group', body: 'Name it after the people in it. You’ll invite them next.',
          label: 'Group name', placeholder: 'For example Uni friends', ok: 'Create group',
          check: (v) => (!v ? 'Give the group a name.' : v.length > 60 ? 'Keep the name under 60 characters.' : ''),
        });
        if (!name) return;
        let group;
        try { ({ group } = await momentoApi('/api/groups', momentoJson('POST', { name }))); }
        catch (err) { Momento.toast('Couldn’t create the group', err.message); return; }
        open.add(group.id);
        await load();
        Momento.toast('Group created', `Invite friends to ${group.name}`);
        const card = body.querySelector(`.grc[data-id="${CSS.escape(group.id)}"]`);
        card?.scrollIntoView({ block: 'center', behavior: still ? 'auto' : 'smooth' });
        invite(group, card?.querySelector('[data-invite]'));
      }

      async function invite(g, from) {
        const email = await Momento.ask({
          from, title: `Invite a friend to ${g.name}`, body: 'They’ll get an email, and the invite waits here once they log in with that address. When they join, they see every album shared with the group.',
          label: 'Their email', type: 'email', placeholder: 'name@example.com', ok: 'Send invite',
          check: (v) => (EMAIL_RE.test(v) ? '' : 'Enter an email address like name@example.com.'),
        });
        if (!email) return;
        try {
          await momentoApi(`/api/groups/${encodeURIComponent(g.id)}/invites`, momentoJson('POST', { email }));
          open.add(g.id);
          Momento.toast('Invite sent', email);
          await load(true);
        } catch (err) { Momento.toast('Couldn’t send the invite', err.message); }
      }

      async function rename(g, from) {
        const name = await Momento.ask({
          from, title: 'Rename group', label: 'Group name', value: g.name, ok: 'Save name',
          check: (v) => (!v ? 'Give the group a name.' : v.length > 60 ? 'Keep the name under 60 characters.' : ''),
        });
        if (!name || name === g.name) return;
        try {
          await momentoApi(`/api/groups/${encodeURIComponent(g.id)}`, momentoJson('PATCH', { name }));
          Momento.toast('Group renamed', name);
          await load(true);
        } catch (err) { Momento.toast('Couldn’t rename the group', err.message); }
      }

      async function removeGroup(g, from) {
        const others = g.members.length - 1;
        const ok = await Momento.confirm({
          from, title: `Delete “${g.name}”?`,
          body: `${others ? `${plural(others, 'person loses', 'people lose')} access to the albums shared with it, unless they joined an album with its code.` : 'Nobody else is in it yet.'} The albums themselves stay with their hosts.`,
          ok: 'Delete group',
        });
        if (!ok) return;
        try {
          await momentoApi(`/api/groups/${encodeURIComponent(g.id)}`, { method: 'DELETE' });
          open.delete(g.id);
          Momento.toast('Group deleted', g.name, { danger: true });
          await load(true);
        } catch (err) { Momento.toast('Couldn’t delete the group', err.message); }
      }

      async function leave(g, from) {
        const hosting = g.albums.filter((a) => a.hostIsYou).length;
        const ok = await Momento.confirm({
          from, title: `Leave “${g.name}”?`,
          body: `You’ll stop seeing the albums shared with it, unless you joined one with its code. ${hosting ? `The ${plural(hosting, 'album', 'albums')} you host leave the group with you. ` : ''}Your photos stay in the albums.`,
          ok: 'Leave group',
        });
        if (!ok) return;
        try {
          await momentoApi(`/api/groups/${encodeURIComponent(g.id)}/members/me`, { method: 'DELETE' });
          open.delete(g.id);
          Momento.toast('You left the group', g.name);
          await load(true);
        } catch (err) { Momento.toast('Couldn’t leave the group', err.message); }
      }

      async function removeMember(g, btn) {
        const name = btn.dataset.name;
        const ok = await Momento.confirm({
          from: btn, title: `Remove ${name} from “${g.name}”?`,
          body: 'They stop seeing the albums shared with the group, unless they joined one with its code. Albums they host leave the group with them. Their photos stay.',
          ok: 'Remove',
        });
        if (!ok) return;
        try {
          await momentoApi(`/api/groups/${encodeURIComponent(g.id)}/members/${encodeURIComponent(btn.dataset.remove)}`, { method: 'DELETE' });
          Momento.toast(`${name} was removed`, g.name, { danger: true });
          await load(true);
        } catch (err) { Momento.toast('Couldn’t remove them', err.message); }
      }

      async function cancelInvite(g, btn) {
        btn.disabled = true;
        try {
          await momentoApi(`/api/groups/${encodeURIComponent(g.id)}/invites/${encodeURIComponent(btn.dataset.cancel)}`, { method: 'DELETE' });
          Momento.toast('Invite taken back', btn.dataset.email);
          await load(true);
        } catch (err) { btn.disabled = false; Momento.toast('Couldn’t take the invite back', err.message); }
      }

      $('grNew').addEventListener('click', (e) => newGroup(e.currentTarget));
      // An album made from here (Add an album) shows up in its group straight away
      document.addEventListener('momento:albums', () => load(true));

      // ---- Start ----
      document.addEventListener('DOMContentLoaded', async () => {
        let user;
        try { user = await Momento.sessionReady; }
        catch (err) { say('Couldn’t reach Momento. Check your connection, then reload the page.', true); return; }
        if (!user) { location.replace('index.html?login=1&next=' + encodeURIComponent('groups.html')); return; }
        if (!user.emailVerified) return;   // the confirm-your-email popup (assets/guard.js) covers the page
        load();
      });
    })();

    // ---- The header gains a veil once scrolled, and the page opens ----
    const header = document.getElementById('header');
    const veil = () => header.classList.toggle('is-veiled', scrollY > 40);
    addEventListener('scroll', veil, { passive: true });
    veil();
    // (after the page intro, when there is one: it lifts the veil by announcing momento:intro-reveal)
    const open = () => requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-ready')));
    if (root.classList.contains('intro-on')) document.addEventListener('momento:intro-reveal', open, { once: true });
    else open();

    // ---- One loop for everything that moves ----
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(Math.max((now - last) / 1000, 0), .1);
      last = now;
      if (!document.hidden) {
        renderFluid(dt);
        if (useCursor) {
          rx = lerp(rx, pointer.x, .35); ry = lerp(ry, pointer.y, .35);
          if (Math.abs(pointer.x - rx) < .05 && Math.abs(pointer.y - ry) < .05) { rx = pointer.x; ry = pointer.y; }
          const lx = pointer.x - rx, ly = pointer.y - ry;
          const lens = root.classList.contains('cursor-hover') || root.classList.contains('cursor-drag');
          const s = lens ? 0 : Math.min(Math.hypot(lx, ly) / 50, .55);
          const tf = `translate3d(${rx}px, ${ry}px, 0) rotate(${lens ? 0 : Math.atan2(ly, lx)}rad) scale(${1 + s}, ${1 - s * .45})`;
          if (tf !== cursorEl._tf) cursorEl.style.transform = cursorEl._tf = tf;
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>

  <!-- @shared:js (generated block; the same in index.html and albums.html) -->
  <script>
  // Shared by index.html and albums.html: theme, account, account menu.
  (() => {
    const root = document.documentElement;
    const KEY = 'momento-theme';
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const TH = window.__theme || (window.__theme = { target: 0, a: 0, b: 0 });
    const themeListeners = new Set();
    const read = () => { try { return localStorage.getItem(KEY) || 'system'; } catch (e) { return 'system'; } };
    const resolve = (p) => (p === 'dark' || (p === 'system' && mq.matches) ? 'dark' : 'light');
    let pref = read();
  
    // Applies a preference. The page cross-fades where View Transitions exist; the silk shader
    // eases on its own from the new target
    function apply(p, animate) {
      pref = p;
      const next = resolve(p);
      const flip = () => { root.dataset.theme = next; root.dataset.themePref = p; TH.target = next === 'dark' ? 1 : 0; };
      if (root.dataset.theme === next) root.dataset.themePref = p;
      else if (animate && document.startViewTransition && !reduced.matches) {
        root.classList.add('theming');   // so the page-to-page motion doesn't also play on a theme switch
        const done = () => root.classList.remove('theming');
        document.startViewTransition(flip).finished.then(done, done);
      } else flip();
      themeListeners.forEach((fn) => fn(p, next));
    }
    mq.addEventListener('change', () => { if (pref === 'system') apply('system', true); });
    addEventListener('storage', (e) => { if (e.key === KEY) apply(read(), true); });
  
    const Momento = (window.Momento = window.Momento || {});
    Momento.theme = {
      get pref() { return pref; },
      get resolved() { return resolve(pref); },
      set(p) {
        try { localStorage.setItem(KEY, p); } catch (e) {}
        apply(p, true);
      },
      onChange(fn) { themeListeners.add(fn); },
    };
  
    // ---- Account: kept for the tab (sessionStorage), shared by every page ----
    const AKEY = 'momento-account';
    const NOTIFY = { photos: true, closing: true, recap: false };
    const accountListeners = new Set();
    const norm = (a) => a && { name: '', email: '', ...a, notify: { ...NOTIFY, ...(a.notify || {}) } };
    let current = null;
    const persist = () => {
      try {
        if (current) sessionStorage.setItem(AKEY, JSON.stringify(current));
        else { sessionStorage.removeItem(AKEY); sessionStorage.removeItem('momento-user'); }
      } catch (e) {}
    };
    const emit = () => accountListeners.forEach((fn) => fn(current));
    Momento.account = {
      get() { return current; },
      set(patch) {
        current = norm({ ...(current || {}), ...patch, notify: { ...(current && current.notify), ...patch.notify } });
        persist(); emit();
        return current;
      },
      clear() { current = null; persist(); emit(); },
      onChange(fn) { accountListeners.add(fn); },
    };
  
    Momento.sessionReady = momentoApi('/api/auth/me').then(({ user }) => {
      if (user) Momento.account.set(user); else Momento.account.clear();
      return user;
    });
    Momento.sessionReady.catch(() => {});

    // ---- Account chip, menu and dialogs ----
    const svg = (inner, size = 18) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
    const ICON = {
      chev: svg('<path d="m6 9 6 6 6-6"/>', 14),
      close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
      settings: svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
      help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.1-2.4 3.8M12 17h.01"/>'),
      logout: svg('<path d="M9 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3M15 8l4 4-4 4M19 12H9"/>'),
      sun: svg('<circle cx="12" cy="12" r="3.6"/><g class="rays"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></g>', 16),
      moon: svg('<path class="moon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>', 16),
      system: svg('<rect x="3" y="4.5" width="18" height="12" rx="2.2"/><path d="M8.5 20h7M12 16.5V20"/><circle class="scr-dot" cx="12" cy="10.5" r="1.8" fill="currentColor" stroke="none"/>', 16),
    };
    const first = (n) => (n || '').trim().split(/\s+/)[0] || '';
    const SUPPORT = 'support@hexarch.org';   // placeholder address
  
    // The custom cursor can't draw above a modal, so the normal cursor comes back while one is open
    let cursorWas = false;
    // The card grows out of the account chip when it opens and shrinks back into it when it closes:
    // the chip's box and the card's box, as a move and a (non-uniform) scale
    const morph = (from, card) => {
      const f = from.getBoundingClientRect(), c = card.getBoundingClientRect();
      if (!f.width || !c.width) return null;
      const dx = f.left + f.width / 2 - (c.left + c.width / 2), dy = f.top + f.height / 2 - (c.top + c.height / 2);
      return `translate(${dx}px, ${dy}px) scale(${Math.max(.08, f.width / c.width)}, ${Math.max(.05, f.height / c.height)})`;
    };
    function dialog(id, html, getReturn) {
      const d = document.createElement('dialog');
      d.className = 'acct-dialog'; d.id = id; d.setAttribute('aria-labelledby', `${id}Title`);
      d.innerHTML = html;
      document.body.append(d);
      const card = () => d.querySelector('.acct-card');
      let closing = false;
      d.dismiss = async () => {

          try { await c.animate(out, { duration: shape ? 340 : 200, easing: 'cubic-bezier(.5, 0, .75, 0)', fill: 'forwards' }).finished; } catch (e) {}
        }

        if (c) c.getAnimations().forEach((a) => a.cancel());

      };
      d.addEventListener('pointerdown', (e) => { d._downOutside = e.target === d; }); d.addEventListener('click', (e) => { if (e.target === d && d._downOutside) d.dismiss(); });
      d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => d.dismiss()));
      d.addEventListener('cancel', (e) => { e.preventDefault(); d.dismiss(); });

        const on = b.dataset.theme === Momento.theme.pref;
        b.setAttribute('aria-checked', on);
        if (on) seg.style.setProperty('--i', i);
      });
      Momento.theme.onChange(sync);
      sync();
    }
  
    // Fills one host element with the chip and its menu. `out` (optional) is the signed-out UI,
    // shown instead of the chip when there is no account. `always` shows the chip regardless.
    function mountAccount({ host, out, always, onLogout }) {
      let built = null;
      function build() {
        const wrap = document.createElement('div');
        wrap.className = 'acct';
        wrap.innerHTML = `
          <button class="acct-btn glass" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="acctMenu" aria-label="Account menu"><i class="acct-av"></i><span class="acct-name"></span>${ICON.chev.replace('<svg', '<svg class="acct-chev"')}</button>
          <div class="acct-menu glass" id="acctMenu" role="menu" aria-label="Account">
            <div class="acct-head"><i class="acct-av"></i><span><b></b><small></small></span></div>
            <button class="acct-item" type="button" role="menuitem" data-act="settings">${ICON.settings}Account settings</button>
            <div class="acct-label" id="acctThemeLabel">Appearance</div>
            <div class="acct-seg" role="radiogroup" aria-labelledby="acctThemeLabel">
              <span class="acct-seg-pill" aria-hidden="true"></span>
              <button type="button" role="radio" aria-checked="false" data-theme="light">${ICON.sun}Light</button>
              <button type="button" role="radio" aria-checked="false" data-theme="dark">${ICON.moon}Dark</button>
              <button type="button" role="radio" aria-checked="false" data-theme="system">${ICON.system}System</button>
            </div>
            <button class="acct-item" type="button" role="menuitem" data-act="help">${ICON.help}Help and support</button>
            <hr class="acct-sep">
            <button class="acct-item" type="button" role="menuitem" data-act="logout">${ICON.logout}Log out</button>
          </div>`;
        host.append(wrap);
  
        const btn = wrap.querySelector('.acct-btn'), menu = wrap.querySelector('.acct-menu'), seg = wrap.querySelector('.acct-seg');
        const segBtns = [...seg.querySelectorAll('button')];
        const items = () => [...menu.querySelectorAll('.acct-item, .acct-seg button')];
        let open = false;
  
        function setOpen(v, focusFirst) {
          if (v === open) return;
          open = v;
          menu.classList.toggle('is-open', v);
          btn.setAttribute('aria-expanded', v);
          if (v && focusFirst) items()[0].focus();
        }
        btn.addEventListener('click', (e) => setOpen(!open, e.detail === 0));
        document.addEventListener('pointerdown', (e) => { if (open && !wrap.contains(e.target)) setOpen(false); });
        wrap.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && open) { setOpen(false); btn.focus(); return; }
          if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) return;
          e.preventDefault();
          if (!open) { setOpen(true, true); return; }
          const list = items(), i = list.indexOf(document.activeElement);
          const next = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
          list[next].focus();
        });
        menu.addEventListener('click', async (e) => {
          const choice = e.target.closest('.acct-seg button');
          if (choice) { Momento.theme.set(choice.dataset.theme); return; }   // stays open so the change can be seen
          const item = e.target.closest('.acct-item');
          if (!item) return;
          setOpen(false);
          const act = item.dataset.act;
          if (act === 'settings') Momento.openSettings(btn);
          else if (act === 'help') Momento.openHelp(btn);
          else { try { await momentoApi('/api/auth/logout', { method: 'POST' }); } catch (err) { Momento.toast('Could not log out', err.message); return; } Momento.account.clear(); if (onLogout) { Momento.flash('You’re logged out', 'Log back in any time'); onLogout(); } else Momento.toast('You’re logged out', 'Log back in any time'); }
        });
  
        const syncSeg = () => {
          segBtns.forEach((b, i) => {
            const on = b.dataset.theme === Momento.theme.pref;
            b.setAttribute('aria-checked', on);
            if (on) seg.style.setProperty('--i', i);
          });
        };
        Momento.theme.onChange(syncSeg);
        syncSeg();
        return { avatars: wrap.querySelectorAll('.acct-av'), name: wrap.querySelector('.acct-name'), headName: menu.querySelector('.acct-head b'), headMail: menu.querySelector('.acct-head small') };
      }
      function render() {
        const a = current, show = !!a || !!always;
        host.hidden = !show;
        if (out) out.hidden = show;
        if (!show) return;
        built ||= build();
        const name = (a && a.name) || '';
        built.avatars.forEach((el) => { el.textContent = (name || 'You')[0].toUpperCase(); });
        built.name.textContent = first(name) || 'You';
        built.headName.textContent = name || 'You';
        built.headMail.textContent = (a && a.email) || 'Preview account';
      }
      accountListeners.add(render);
      render();
    }
  
    // ---- The thread: a faint string draws itself down the page as you scroll, with small see-through
    // polaroids hung along it. A page marks the container:
    //   <div class="trail" data-trail data-avoid="selectors of content to keep clear" data-pad="26">
    // The string runs behind everything; a print is only hung where its box clears the avoided content ----
    (function trail() {
      const host = document.querySelector('[data-trail]');
      if (!host) return;
      const wrap = host.parentElement;
      const IDS = [1062, 1011, 1027, 64, 1047, 1012, 177, 1025, 91, 1040, 1015, 1035, 1005, 1043, 1050, 1054, 1058, 1060, 1068, 1074];
      const TILT = [-9, 6, -5, 10, -12, 4, -7, 8, -3, 12, -10, 5];
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      const path = document.createElementNS(NS, 'path');
      svg.setAttribute('class', 'trail-svg'); path.setAttribute('class', 'trail-line'); svg.append(path);
      const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      let prints = [], lut = [], len = 0, target = 0, drawn = 0, raf = 0, timer = 0;
  
      function build() {
        host.replaceChildren(svg); prints = []; lut = [];
        const wr = wrap.getBoundingClientRect(), W = wrap.offsetWidth, H = wrap.offsetHeight;
        const small = innerWidth < 700, pad = +host.dataset.pad || 26;
        svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  
        // A vertical trochoid: when the loop radius d outgrows the step r, the string curls
        const y0 = innerHeight * .85, y1 = H - 40;
        const r = clamp(W * .05, 46, 80) * (small ? .7 : 1), swing = small ? .26 : .36;
        const pts = [];
        for (let t = 0; ; t += .11) {
          const d = r * (.55 + .95 * Math.max(0, Math.sin(t * .23 + 1)));
          const y = y0 + r * t - d * Math.sin(t);
          if (y > y1) break;
          pts.push(`${(W / 2 + W * swing * Math.sin(t * .11) + W * .07 * Math.sin(t * .37) + d * Math.cos(t)).toFixed(1)},${y.toFixed(1)}`);
        }
        path.setAttribute('d', 'M' + pts.join(' L'));
        len = path.getTotalLength();
        path.style.strokeDasharray = len;
        // Length against the furthest point reached so far, so the loops don't confuse the search
        let maxY = -Infinity;
        for (let i = 0; i <= 600; i++) {
          const l = len * i / 600;
          maxY = Math.max(maxY, path.getPointAtLength(l).y);
          lut.push([l, maxY]);
        }
  
        // The content to keep clear of, measured once, relative to the page: whole blocks the page names
        // (data-avoid), plus every line of text, picture and control, so a print can hang in the empty
        // parts of a glass panel but never under what you read
        const blocks = [];
        const keep = (b, p) => { if (b.width > 1 && b.height > 1) blocks.push({ l: b.left - wr.left - p, t: b.top - wr.top - p, r: b.right - wr.left + p, b: b.bottom - wr.top + p }); };
        const sel = host.dataset.avoid || '';
        if (sel) wrap.querySelectorAll(sel).forEach((el) => keep(el.getBoundingClientRect(), pad));
        wrap.querySelectorAll('img, svg, video, canvas, input, textarea, select, button, .btn').forEach((el) => {
          if (!host.contains(el) && (el.tagName !== 'svg' || !el.parentElement.closest('svg'))) keep(el.getBoundingClientRect(), 8);
        });
        const range = document.createRange();
        const words = document.createTreeWalker(wrap, NodeFilter.SHOW_TEXT);
        for (let n; (n = words.nextNode());) {
          if (!n.nodeValue.trim() || host.contains(n) || /^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.parentElement.tagName)) continue;
          range.selectNodeContents(n);
          for (const q of range.getClientRects()) keep(q, 10);
        }
        const hits = (x, y, w, h) => blocks.some((b) => x + w > b.l && x < b.r && y + h > b.t && y < b.b);
  
        // Hang a print every so often along the string, wherever there is room for it
        const gap = small ? 80 : 90, kept = [];
        let k = 0;
        for (let l = 140; l < len - 40; l += gap) {
          const p = path.getPointAtLength(l), q = path.getPointAtLength(l + 4);
          const pw = (small ? 30 : 36) + (k % 3) * 4, ph = pw + 9;
          const x = p.x - pw / 2, y = p.y - 2;
          if (x < 8 || x + pw > W - 8 || y < 80 || y + ph > H - 40 || hits(x, y, pw, ph)) continue;
          // Not too near the last one: prints are an accent on the string, not a row of photos
          if (kept.some((o) => Math.hypot(o.x - x, o.y - y) < 150)) continue;
          kept.push({ x, y });
          // It hangs under the string, leaning a little with the string's direction
          const dev = ((Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI - 90 + 540) % 360) - 180;
          const el = document.createElement('span');
          el.className = 'tp';
          el.style.cssText = `--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--w:${pw}px;--r:${(clamp(dev * .25, -14, 14) + TILT[k % TILT.length] * .5).toFixed(1)}deg`;
          el.innerHTML = `<img src="https://picsum.photos/id/${IDS[k % IDS.length]}/96/96" alt="" loading="lazy" decoding="async" draggable="false">`;
          host.append(el);
          prints.push({ el, l, on: false });
          k++;
        }
        drawn = reduced.matches ? len : Math.min(drawn, len);
        target = reduced.matches ? len : aim();
        write();
        if (drawn !== target) kick();
      }
  
      // How far along the string the reading line (a little above the bottom of the screen) has got
      function aim() {
        if (!lut.length) return 0;
        const y = scrollY + innerHeight * .7;
        let lo = 0, hi = lut.length - 1;
        while (lo < hi) { const mid = (lo + hi) >> 1; lut[mid][1] < y ? lo = mid + 1 : hi = mid; }
        return lut[lo][0];
      }
      function write() {
        path.style.strokeDashoffset = (len - drawn).toFixed(1);
        for (const p of prints) {
          const on = p.l <= drawn;
          if (on !== p.on) { p.on = on; p.el.classList.toggle('is-on', on); }
        }
      }
      // The string eases toward the reading line; the loop stops as soon as it gets there
      function tick() {
        raf = 0;
        const d = target - drawn;
        drawn = Math.abs(d) < .5 ? target : drawn + d * .2;
        write();
        if (drawn !== target) raf = requestAnimationFrame(tick);
      }
      function kick() { if (!raf) raf = requestAnimationFrame(tick); }
  
      if (!reduced.matches) addEventListener('scroll', () => { target = aim(); kick(); }, { passive: true });
      new ResizeObserver(() => { clearTimeout(timer); timer = setTimeout(build, 250); }).observe(wrap);
      // Text that is still rising into place when the page first measures is measured again once it has settled
      const later = (ms) => () => { clearTimeout(timer); timer = setTimeout(build, ms); };
      addEventListener('load', later(1800));
      document.addEventListener('momento:intro-end', later(1600));
    })();
  
    // ---- Leaving a page, in browsers that can't cross-fade between pages themselves: the page fades and
    // lifts away (CSS .is-leaving), then the next one loads ----
    // (Also for pages opened straight from the folder: browsers only cross-fade pages served from an address)
    const ptFile = location.protocol === 'file:';
    if ((!('CSSViewTransitionRule' in window) || ptFile) && !reduced.matches) {
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target || a.hasAttribute('download')) return;
        const url = new URL(a.href, location.href);
        if (url.origin !== location.origin || url.pathname === location.pathname) return;   // other sites, mailto:, same-page anchors
        e.preventDefault();
        root.classList.add('is-leaving');
        if (ptFile) { root.classList.add('pt-file'); try { sessionStorage.setItem('momento-pt', '1'); } catch (err) {} }
        setTimeout(() => { location.href = url.href; }, 240);
      });
      addEventListener('pageshow', (e) => { if (e.persisted) root.classList.remove('is-leaving'); });   // back from the page cache
    }
  
    // ---- Page intros ----
    // A page puts a veil (#intro) over itself and plays a short sequence once per tab session, ending by
    // handing off to real elements (the header logo, an album cover, a nav icon). Momento.intro(run) gives
    // `run` a small kit. A press, key, wheel or touch skips straight to the finished page.
    Momento.intro = (run) => {
      const veil = document.getElementById('intro');
      if (!root.classList.contains('intro-on')) { if (veil) veil.remove(); return; }
      const anims = [], undo = [];
      let done = false, revealed = false;
      // The moment the page's own entrance (groups rising in, headings) may begin
      const reveal = () => { if (!revealed) { revealed = true; document.dispatchEvent(new Event('momento:intro-reveal')); } };
      const EVENTS = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
      const skip = () => finish(true);
      function finish(skipped) {
        if (done) return;
        done = true;
        EVENTS.forEach((t) => removeEventListener(t, skip, true));
        root.classList.remove('intro-on');
        anims.forEach((a) => a.cancel());
        undo.forEach((fn) => fn());
        try { sessionStorage.setItem('momento-intro-' + root.dataset.page, '1'); } catch (e) {}
        reveal();
        document.dispatchEvent(new Event('momento:intro-end'));
        if (!veil) return;
        if (!skipped) { veil.remove(); return; }
        // Skipped: the veil keeps catching the press for a moment, then fades off the finished page
        veil.style.display = 'block';
        veil.animate({ opacity: [1, 0] }, { duration: 260, easing: 'ease-out' }).finished.then(() => veil.remove(), () => veil.remove());
      }
      // Once the intro has finished (or been skipped) nothing in the sequence may carry on: its promises
      // simply never settle, so the code after an `await` never runs against elements that are gone
      const never = new Promise(() => {});
      const kit = {
        get done() { return done; },
        reveal, finish,
        undo: (fn) => undo.push(fn),
        // Plays an animation that holds its end state until the intro finishes; resolves when it ends
        play(el, frames, opts = {}) {
          if (done || !el) return never;
          const a = el.animate(frames, { fill: 'both', ...opts });
          anims.push(a);
          return a.finished.then(() => {}, () => never);
        },
        // Keeps a real element invisible until its turn
        hold: (el) => kit.play(el, [{ opacity: 0 }, { opacity: 0 }], { duration: 1 }),
        wait: (ms) => new Promise((r) => setTimeout(() => { if (!done) r(); }, ms)),
        // Calls fn(progress 0..1) every frame for `ms`
        tween: (ms, fn) => new Promise((res) => {
          const t0 = performance.now();
          const step = (t) => { if (done) return; const p = Math.min(1, (t - t0) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else res(); };
          requestAnimationFrame(step);
        }),
        // Where `el` would have to move and scale (about its top left) to cover `to`
        flip(el, to) {
          const a = el.getBoundingClientRect();
          return `translate(${to.left - a.left}px, ${to.top - a.top}px) scale(${to.width / a.width}, ${to.height / a.height})`;
        },
      };
      if (scrollY > 40) { finish(); return; }   // reopened part-way down: no intro
      EVENTS.forEach((t) => addEventListener(t, skip, { capture: true, passive: true }));
      setTimeout(() => finish(), 9000);
      Promise.resolve().then(() => run(kit)).then(() => finish(), (e) => { console.error(e); finish(true); });
    };
  
    // ---- Site footer: one footer for every page. A page marks it <footer class="site-foot" data-site-foot> ----
    document.querySelectorAll('[data-site-foot]').forEach((foot) => {
      const home = root.dataset.page === 'home', P = home ? '' : 'index.html';
      const up = svg('<path d="M12 19V5M6 11l6-6 6 6"/>', 15);
      foot.innerHTML = `
        <div class="sf-grid">
          <div class="sf-brand">
            <a class="sf-logo" href="${home ? '#home' : 'index.html'}" aria-label="Momento, home"><svg class="glyph" aria-hidden="true"><use href="#glyph-album"/></svg><svg class="brand-word" aria-hidden="true"><use href="#wordmark"/></svg></a>
            <p>Every photo from your event, in one shared album.</p>
          </div>
          <nav class="sf-col" aria-labelledby="sfProduct">
            <h2 id="sfProduct">Product</h2>
            <ul>
              <li><a class="sf-link" href="${P}#how-it-works">How it works</a></li>
              <li><a class="sf-link" href="${P}#features">Features</a></li>
              <li><a class="sf-link" href="${P}#for-hosts">For hosts</a></li>
              <li><a class="sf-link" href="${P}#pricing">Pricing</a></li>
            </ul>
          </nav>
          <nav class="sf-col" aria-labelledby="sfAlbums">
            <h2 id="sfAlbums">Your albums</h2>
            <ul>
              <li><a class="sf-link" href="albums.html">My albums</a></li>
              <li><a class="sf-link" href="albums.html#join">Join with a code</a></li>
              <li><a class="sf-link" href="sort.html">Sort photos</a></li>
              <li><a class="sf-link" href="groups.html">Friend groups</a></li>
              <li><a class="sf-link" href="${P}#for-hosts" data-create>Create an album</a></li>
              <li><a class="sf-link" href="settings.html">Settings</a></li>
            </ul>
          </nav>
          <nav class="sf-col" aria-labelledby="sfEvents">
            <h2 id="sfEvents">Events</h2>
            <ul>
              <li><a class="sf-link" href="events.html">Events near you</a></li>
              <li><a class="sf-link" href="${P}#for-hosts" data-create>Host a public event</a></li>
              <li><a class="sf-link" href="events.html#alerts">Event alerts</a></li>
            </ul>
          </nav>
          <nav class="sf-col" aria-labelledby="sfHelp">
            <h2 id="sfHelp">Help</h2>
            <ul>
              <li><button class="sf-link" type="button" data-foot-act="help">Help and support</button></li>
              <li><a class="sf-link" href="support.html">Contact support</a></li>
              <li><a class="sf-link" href="${P}#faq">FAQ</a></li>
              <li><a class="sf-link" href="mailto:${SUPPORT}">Email support</a></li>
              <li><a class="sf-link" href="privacy.html">Privacy policy</a></li>
              <li data-foot-account hidden><button class="sf-link" type="button" data-foot-act="settings">Account settings</button></li>
            </ul>
          </nav>
        </div>
        <div class="sf-base">
          <p class="sf-legal"><span>© 2026 HexArch Limited</span><span>Proof of concept. Design and features are subject to change.</span></p>
          <div class="acct-seg" role="radiogroup" aria-label="Appearance">
            <span class="acct-seg-pill" aria-hidden="true"></span>
            <button type="button" role="radio" aria-checked="false" data-theme="light">${ICON.sun}Light</button>
            <button type="button" role="radio" aria-checked="false" data-theme="dark">${ICON.moon}Dark</button>
            <button type="button" role="radio" aria-checked="false" data-theme="system">${ICON.system}System</button>
          </div>
          <button class="sf-top sf-link" type="button">Back to top${up}</button>
        </div>`;
      wireSeg(foot.querySelector('.acct-seg'));
      foot.querySelectorAll('[data-foot-act]').forEach((b) => b.addEventListener('click', () => {
        if (b.dataset.footAct === 'help') Momento.openHelp(b); else Momento.openSettings(b);
      }));
      foot.querySelector('.sf-top').addEventListener('click', () => scrollTo({ top: 0, behavior: reduced.matches ? 'auto' : 'smooth' }));
      // Account settings only makes sense once there is an account
      const acct = foot.querySelector('[data-foot-account]');
      const syncAcct = () => { acct.hidden = !current; };
      accountListeners.add(syncAcct); syncAcct();
      // On the home page its own sections are reached the way its menu does it (the album stage is pinned)
      if (home) foot.addEventListener('click', (e) => {
        const a = e.target.closest('a[href^="#"]');
        if (!a || a.matches('.sf-logo')) return;
        const item = document.querySelector(`.menu-item[href="${a.getAttribute('href')}"]`);
        if (item) { e.preventDefault(); item.click(); }
      });
    });
  
    // Pages mark where the chip goes:
    //   <div data-acct-host hidden data-acct-out="authOut"></div>            (home: shown once signed in)
    //   <div data-acct-host data-acct-always data-acct-logout="index.html">   (albums: always there)
    document.querySelectorAll('[data-acct-host]').forEach((host) => {
      const to = host.dataset.acctLogout;
      mountAccount({
        host,
        out: host.dataset.acctOut ? document.getElementById(host.dataset.acctOut) : null,
        always: host.hasAttribute('data-acct-always'),
        onLogout: to ? () => { location.href = to; } : null,
      });
    });
  })();

  // ---- Popup cards catch the pointer light too (they're created later, so listen on the page) ----
  (() => {
    const SEL = '.auth-card, .modal-card, .acct-card, .vgate-card';
    let el = null, x = 0, y = 0, queued = false;
    addEventListener('pointermove', (e) => {
      const card = e.target.closest ? e.target.closest(SEL) : null;
      if (card !== el) { if (el) el.style.setProperty('--shine', 0); el = card; if (el) el.style.setProperty('--shine', 1); }
      if (!el) return;
      x = e.clientX; y = e.clientY;
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        if (!el) return;
        const r = el.getBoundingClientRect();
        el.style.setProperty('--mx', `${x - r.left}px`);
        el.style.setProperty('--my', `${y - r.top}px`);
      });
    }, { passive: true });
  })();
    </script>
