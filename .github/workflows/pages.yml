# Publishes the website to https://hexarch.org (GitHub Pages) on every push that changes Client/.
# Client/ is the Next.js site: it's built here (npm run build makes the static site in Client/out) and only
# that output is published. assets/devpreview.js (local sample data) is removed from the published files.
# If the build fails, nothing is published and the site already live stays as it is.
#
# The HTML version of the site (before Next.js) is kept on the html-site branch.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
# To publish again without changing anything: GitHub > Actions > Publish site > Run workflow.

name: Publish site

on:
  push:
    branches: [main]
    paths: ['Client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Build the site
        run: |
          npm ci --no-audit --no-fund
          npm run build
          rm -f out/assets/devpreview.js
          ls out

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: Client/out

      - id: deployment
        uses: actions/deploy-pages@v5
