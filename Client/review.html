<!doctype html>
<html lang="en" data-page="review">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Photo review | Momento</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <style>[hidden] { display: none !important; }</style>
  <script>
  // Staff only: pictures the automatic check declined, which the uploader asked a person to look at.
  // Opened from the staff email as review.html?id=<decision>: that picture comes first.
  // Each one gets a content level (0-100, Momento's standard). The levels teach the automatic check
  // (services/stageOneLearning.js): 0-50 publishes, 100 declines, 75 asks staff to publish or keep it private.
  // The uploader is told either way (adminController.decide).
  (() => {
    let pref = 'system';
    try { pref = localStorage.getItem('momento-theme') || 'system'; } catch (e) {}
    const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
  </script>
  <script src="assets/api.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/glass.css">
  <style>
    /* The site's palette and type (as albums.html and index.html) */
    :root {
      --paper: #F8F7FA; --dusk: #2E2C3A; --slate: #5C596B; --stone: #6F6B7D; --line: #D6D2DE; --surface: #FFFFFF;
      --tide: #6F9896; --safe: #2F7D4F; --hold: #A86A12; --stop: #B4503F;
      --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      --spring: cubic-bezier(0.34, 1.4, 0.64, 1); --out: cubic-bezier(0.16, 1, 0.3, 1);
      --focus-ring: #2E2C3A;
    }
    :root[data-theme="dark"] { --paper: #121119; --dusk: #F2EFF8; --slate: #B4AFC8; --stone: #9A95AE; --line: #2C2A38; --surface: #1C1B25;
      --safe: #7CC79A; --hold: #E2B062; --stop: #F0A3A3; --focus-ring: #F2EFF8; }
    html { background: radial-gradient(120% 80% at 20% 10%, #FFF8EC, transparent 55%), linear-gradient(160deg, #EDECF2, #C9D0E4) fixed; }
    * { box-sizing: border-box; }
    /* One screen, nothing scrolls: the photo takes whatever room is left */
    html, body { height: 100%; }
    body { margin: 0; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr);
      font-family: var(--font-main); color: var(--dusk); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :is(a, button):focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }

    /* ---- Header: logo, the site's sections, the queue count ---- */
    .header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
      padding: max(1.1rem, env(safe-area-inset-top)) 4% .6rem; }
    .brand { justify-self: start; display: flex; align-items: center; gap: .55rem; height: 2.95rem; text-decoration: none; font-weight: 750; letter-spacing: -.02em; font-size: 1.1rem; }
    .brand img { width: 2rem; height: 2rem; border-radius: 9px; }
    .nav { display: flex; gap: .25rem; padding: .35rem; }
    .nav-item { display: inline-flex; align-items: center; gap: .45rem; color: var(--slate); text-decoration: none; font-size: .88rem; font-weight: 600;
      padding: .6rem 1.15rem; border-radius: 100px; white-space: nowrap; transition: background-color .3s ease, color .3s ease; }
    .nav-item:hover { background: rgba(255, 255, 255, .45); color: var(--dusk); }
    :root[data-theme="dark"] .nav-item:hover { background: rgba(255, 255, 255, .08); }
    .nav-item[aria-current="page"] { color: var(--dusk); background: var(--surface); box-shadow: 0 1px 2px rgba(46, 44, 58, .08), 0 4px 12px rgba(46, 44, 58, .1); }
    .count { justify-self: end; display: inline-flex; align-items: center; gap: .3rem; padding: .5rem .95rem; border-radius: 100px;
      font-size: .85rem; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--slate); }
    .count b { color: var(--dusk); }
    @media (max-width: 760px) {
      .header { grid-template-columns: auto 1fr auto; gap: .5rem; padding-inline: 12px; }
      .brand span { display: none; }
      .nav { justify-self: center; }
      .nav-item { padding: .6rem .75rem; }
      .nav-item span { display: none; }
    }

    /* ---- The photo, its details, and the six levels ---- */
    main { min-height: 0; display: grid; place-items: center; padding: .4rem 4% max(1.2rem, env(safe-area-inset-bottom)); }
    .stage { width: min(100%, 1100px); height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: .8rem;
      padding: .8rem; border-radius: 28px; }
    .frame { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; border-radius: 20px; background: rgba(46, 44, 58, .06); }
    :root[data-theme="dark"] .frame { background: rgba(255, 255, 255, .04); }
    /* Centred in the frame and never larger than it, whatever its shape (portrait or landscape) */
    .frame img { position: absolute; inset: 0; margin: auto; display: block; max-width: calc(100% - 1rem); max-height: calc(100% - 1rem); width: auto; height: auto;
      object-fit: contain; border-radius: 12px; transition: opacity .35s ease, transform .5s var(--out); }
    .frame img.is-loading { opacity: 0; transform: scale(.985); }
    .frame .empty { color: var(--stone); padding: 1rem; text-align: center; }
    .nav-arrow { position: absolute; top: 50%; translate: 0 -50%; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%;
      color: var(--dusk); background: rgba(255, 255, 255, .72); box-shadow: 0 6px 18px -8px rgba(30, 25, 50, .5); transition: transform .3s var(--spring), opacity .2s ease; }
    :root[data-theme="dark"] .nav-arrow { background: rgba(28, 27, 37, .82); }
    .nav-arrow:hover { transform: scale(1.06); }
    .nav-arrow:disabled { opacity: 0; pointer-events: none; }
    .nav-arrow.prev { left: .7rem; } .nav-arrow.next { right: .7rem; }

    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .5rem; min-width: 0; padding: 0 .3rem; }
    .meta .name { flex: 1 1 14rem; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; font-size: 1rem; letter-spacing: -.01em; }
    .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .7rem; border-radius: 100px; font-size: .8rem; font-weight: 600;
      color: var(--slate); background: rgba(46, 44, 58, .07); white-space: nowrap; font-variant-numeric: tabular-nums; }
    :root[data-theme="dark"] .chip { background: rgba(255, 255, 255, .07); }
    .chip svg { flex: none; opacity: .75; }
    .chip.is-due { color: var(--hold); }
    .chip.is-late { color: var(--stop); }

    /* Six levels: green publishes, amber asks, red declines */
    .levels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5rem; }
    .lv { position: relative; display: grid; place-items: center; gap: .05rem; min-height: 3.6rem; padding: .45rem .3rem; border: 0; border-radius: 18px;
      background: rgba(255, 255, 255, .55); box-shadow: inset 0 0 0 1px rgba(46, 44, 58, .08);
      transition: transform .3s var(--spring), background-color .2s ease, box-shadow .2s ease, opacity .2s ease; }
    :root[data-theme="dark"] .lv { background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
    .lv b { font-size: 1.2rem; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
    .lv small { font-size: .72rem; font-weight: 600; color: var(--slate); }
    .lv[data-group="safe"] b { color: var(--safe); }
    .lv[data-group="hold"] b { color: var(--hold); }
    .lv[data-group="stop"] b { color: var(--stop); }
    .lv:hover:not(:disabled) { transform: translateY(-2px); box-shadow: inset 0 0 0 1.5px currentColor, 0 8px 20px -12px rgba(30, 25, 50, .45); }
    .lv[data-group="safe"]:hover:not(:disabled) { color: var(--safe); }
    .lv[data-group="hold"]:hover:not(:disabled), .lv.is-on { color: var(--hold); }
    .lv[data-group="stop"]:hover:not(:disabled) { color: var(--stop); }
    .lv:hover:not(:disabled) small { color: var(--dusk); }
    .lv:active:not(:disabled) { transform: scale(.96); }
    .lv.is-on { box-shadow: inset 0 0 0 2px var(--hold); }
    .lv:disabled { opacity: .45; cursor: default; }
    .lv kbd { position: absolute; top: .3rem; right: .45rem; font: 650 .62rem/1 var(--font-main); opacity: .4; }
    @media (hover: none) { .lv kbd { display: none; } }
    @media (max-width: 560px) { .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); } .lv { min-height: 3.1rem; } }
    /* Level 75: publish it, or keep it private? */
    .ask { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .5rem; }
    .ask span { font-weight: 650; margin-right: .3rem; }
    .ask .btn { display: inline-flex; align-items: center; gap: .45rem; min-height: 2.75rem; padding: 0 1.2rem; border: 0; border-radius: 100px; font: 650 .92rem var(--font-main);
      transition: transform .3s var(--spring); }
    .ask .btn:active { transform: scale(.97); }
    .ask .keep { color: var(--stop) !important; }

    /* ---- Pop-ups: nothing waiting, already reviewed, staff only ---- */
    .pop { width: min(25rem, calc(100vw - 32px)); padding: 1.8rem 1.6rem 1.5rem; border: 0; border-radius: 28px; text-align: center; color: var(--dusk); }
    .pop::backdrop { background: rgba(20, 18, 28, .35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .pop .ic { display: grid; place-items: center; width: 3.4rem; height: 3.4rem; margin: 0 auto .9rem; border-radius: 50%; color: #fff; background: var(--tide); }
    .pop.is-declined .ic { background: #B4503F; }
    .pop h2 { margin: 0 0 .35rem; font-size: 1.35rem; letter-spacing: -.03em; }
    .pop p { margin: 0; color: var(--slate); line-height: 1.5; }
    .pop p b { color: var(--dusk); }
    .pop .pop-acts { display: grid; gap: .55rem; margin-top: 1.3rem; }
    .pop .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; padding: 0 1.3rem; border: 0; border-radius: 100px; font: 650 .95rem var(--font-main); text-decoration: none; }
    @media (prefers-reduced-motion: no-preference) { .pop[open] { animation: pop-in .4s var(--spring); } }
    @keyframes pop-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }
    .status { position: fixed; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); translate: -50% 0; z-index: 5; max-width: calc(100vw - 32px); margin: 0;
      padding: .6rem 1rem; border-radius: 100px; font-size: .85rem; font-weight: 600; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
    .status.is-on { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="Momento, home"><img src="assets/momento-icon.png" alt=""><span>Momento</span></a>
    <nav class="nav glass" aria-label="Main">
      <a class="nav-item" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.4 12 4l8 6.4V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a class="nav-item" href="albums.html" aria-label="My albums"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="17" height="14" rx="3"/><path d="M7 3.5h10"/><path d="m3.5 16 5-4.5 4 3.5 3-2.5 5 4"/></svg><span>My albums</span></a>
      <a class="nav-item" href="events.html" aria-label="Social"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.4-.3 4 1.2 4.5 3.8"/></svg><span>Social</span></a>
      <a class="nav-item" href="review.html" aria-current="page" aria-label="Photo review"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.5 3.2 8.2 7.5 9.5 4.3-1.3 7.5-5 7.5-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.4-4.4"/></svg><span>Review</span></a>
    </nav>
    <span class="count glass" id="count" aria-live="polite" hidden></span>
  </header>

  <main>
    <section class="stage glass" id="stage" aria-label="Photo waiting for review" hidden>
      <div class="frame">
        <img id="photo" alt="">
        <span class="empty" id="empty" hidden></span>
        <button class="nav-arrow prev" type="button" id="prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="nav-arrow next" type="button" id="next" aria-label="Next photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="meta">
        <span class="name" id="name"></span>
        <span class="chip" id="album" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="17" height="14" rx="3"/><path d="m3.5 16 5-4.5 4 3.5 3-2.5 5 4"/></svg><span></span></span>
        <span class="chip" id="uploaded" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span></span></span>
        <span class="chip" id="due" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span></span></span>
        <span class="chip" id="risk" hidden title="Risk: Porn + Hentai + Sexy"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.5 3.2 8.2 7.5 9.5 4.3-1.3 7.5-5 7.5-9.5V6z"/></svg><span></span></span>
      </div>
      <div class="levels" id="levels" role="group" aria-label="Content level"></div>
      <div class="ask" id="ask" hidden>
        <span>Level 75</span>
        <button class="btn btn-light keep" type="button" id="keep">Keep private <kbd>D</kbd></button>
        <button class="btn btn-dark" type="button" id="publish">Publish <kbd>A</kbd></button>
      </div>
    </section>
  </main>

  <!-- One pop-up for every "nothing to do here" moment: the queue is empty, a teammate already reviewed it,
       or this account isn't staff -->
  <dialog class="pop glass" id="pop" aria-labelledby="popTitle">
    <div class="ic" aria-hidden="true"></div>
    <h2 id="popTitle"></h2>
    <p id="popText"></p>
    <div class="pop-acts">
      <button class="btn btn-dark" type="button" id="popNext" hidden>Next photo</button>
      <a class="btn btn-dark" href="index.html" id="popHome">Go Back to Home Page</a>
    </div>
  </dialog>
  <p class="status glass" id="status" role="status" aria-live="polite"></p>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    // Momento's content levels [level, one word, full meaning (tooltip), group]: they teach the automatic check
    const LEVELS = [
      [0, 'Everyday', 'Ordinary life, nothing suggestive', 'safe'],
      [15, 'Exposure', 'Dressed for the setting: pool, beach, sport', 'safe'],
      [25, 'Mild', 'Suggestive pose or framing, covered', 'safe'],
      [50, 'Suggestive', 'Clear sexual hint, still covered', 'safe'],
      [75, 'Nudity', 'Private parts visible, no sexual act', 'hold'],
      [100, 'Explicit', 'Sexual content', 'stop'],
    ];
    const ICON = {
      done: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
      no: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      lock: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>',
    };
    let items = [], index = 0, busy = false, pending = null, statusTimer = 0;
    const previews = new Map();
    const TZ = 'Australia/Sydney';

    for (const [value, word, meaning, group] of LEVELS) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lv'; b.dataset.value = value; b.dataset.group = group;
      b.title = meaning; b.setAttribute('aria-label', `${value}, ${word}: ${meaning}`);
      b.innerHTML = `<b>${value}</b><small>${word}</small><kbd>${LEVELS.findIndex(([v]) => v === value) + 1}</kbd>`;
      b.addEventListener('click', () => choose(value));
      $('levels').append(b);
    }

    const say = (text) => {
      $('status').textContent = text || '';
      $('status').classList.toggle('is-on', !!text);
      clearTimeout(statusTimer);
      if (text) statusTimer = setTimeout(() => $('status').classList.remove('is-on'), 3200);
    };
    function pop({ title, text, icon = 'done', declined = false, next = false, home = true }) {
      const d = $('pop');
      d.classList.toggle('is-declined', declined);
      d.querySelector('.ic').innerHTML = ICON[icon];
      $('popTitle').textContent = title;
      $('popText').replaceChildren(...[].concat(text));
      $('popNext').hidden = !next;
      $('popHome').hidden = !home;
      if (!d.open) d.showModal();
      (next ? $('popNext') : $('popHome')).focus();
    }
    $('popNext').addEventListener('click', () => $('pop').close());
    // Nothing waiting: say so, with the way home (the page behind stays clean)
    const emptyQueue = () => { $('stage').hidden = true; $('count').hidden = true; pop({ title: 'No photos to review', text: 'Everything has been reviewed. New requests show up here.' }); };

    // ---- The picture, fetched with the staff login and shown at its own shape ----
    async function showPreview(it) {
      const photo = $('photo'), empty = $('empty');
      if (photo.dataset.id === it.id) return;
      photo.dataset.id = it.id;
      photo.classList.add('is-loading'); empty.hidden = true;
      try {
        let url = previews.get(it.id);
        if (!url) {
          const r = await fetch(window.MOMENTO_API + '/api/admin/moderation/' + encodeURIComponent(it.id) + '/preview', { credentials: 'include' });
          if (!r.ok) throw new Error(r.status === 404 ? 'This picture isn’t available any more.' : `The picture couldn’t be loaded (${r.status}).`);
          url = URL.createObjectURL(await r.blob());
          previews.set(it.id, url);
        }
        if (photo.dataset.id !== it.id) return;
        photo.onload = () => photo.classList.remove('is-loading');
        photo.src = url;
        photo.alt = it.fileName || 'Photo waiting for review';
      } catch (err) {
        if (photo.dataset.id !== it.id) return;
        photo.removeAttribute('src'); empty.hidden = false; empty.textContent = err.message;
      }
    }

    const fmt = (d) => new Date(d).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    const today = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
    const chip = (id, text, cls = '') => { const c = $(id); c.hidden = !text; c.className = 'chip' + (cls ? ' ' + cls : ''); c.querySelector('span').textContent = text || ''; };
    function render() {
      const it = items[index];
      if (!it) return emptyQueue();
      $('stage').hidden = false;
      $('count').hidden = false;
      $('count').innerHTML = `<b>${index + 1}</b> of ${items.length}`;
      showPreview(it);
      $('name').textContent = it.fileName || 'Photo';
      $('name').title = it.fileName || '';
      chip('album', it.albumName || '');
      chip('uploaded', it.at ? fmt(it.at) : '');
      const t = today();
      chip('due', !it.dueDay ? '' : it.dueDay < t ? 'Overdue' : it.dueDay === t ? 'Due today'
        : 'Due ' + new Date(it.dueDay + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }),
      !it.dueDay ? '' : it.dueDay < t ? 'is-late' : it.dueDay === t ? 'is-due' : '');
      const c = it.scores?.classes;
      const risk = c && ['Porn', 'Hentai', 'Sexy'].every((k) => Number.isFinite(c[k])) ? c.Porn + c.Hentai + c.Sexy : null;
      chip('risk', risk == null ? '' : `${Math.round(risk * 100)}%`);
      $('prev').disabled = index <= 0;
      $('next').disabled = index >= items.length - 1;
      for (const b of $('levels').children) { b.disabled = busy; b.classList.toggle('is-on', Number(b.dataset.value) === pending); }
      $('levels').hidden = pending != null;
      $('ask').hidden = pending == null;
    }
    const move = (step) => { const to = index + step; if (to >= 0 && to < items.length) { index = to; pending = null; render(); } };

    // ---- Rating: 0-50 publishes, 100 declines, 75 asks; the level is kept so the check learns from it ----
    function choose(level) {
      if (!items[index] || busy) return;
      if (level <= 50) return decide(true, level);
      if (level === 100) return decide(false, level);
      pending = level; render(); $('publish').focus();
    }
    function afterDecision(it, message) {
      const at = items.findIndex((x) => x.id === it.id);
      items = items.filter((x) => x.id !== it.id);
      previews.delete(it.id);
      pending = null;
      if (!items.length) { emptyQueue(); if (message) say(message); return; }
      index = Math.min(Math.max(0, at), items.length - 1);
      if (message) say(message);
      render();
    }
    async function decide(allow, severity = pending) {
      const it = items[index];
      if (!it || busy || severity == null) return;
      busy = true; render();
      try {
        await momentoApi('/api/admin/moderation/' + it.id, momentoJson('POST', { allow, severity }));
        busy = false;
        afterDecision(it, `${allow ? 'Published' : 'Kept private'} · level ${severity}. The uploader has been told.`);
      } catch (err) {
        busy = false;
        if (err.status === 409) { await alreadyReviewed(it.id, true); return; }
        if (err.status === 404) { notStaff(); return; }
        say(err.message); render();
      }
    }

    // ---- "This has been reviewed by …": a photo from an email (or on screen) a teammate already decided ----
    async function alreadyReviewed(id, onScreen) {
      let s;
      try { s = await momentoApi('/api/admin/moderation/' + encodeURIComponent(id)); } catch { return false; }
      if (s.waiting) return false;
      if (onScreen) afterDecision({ id }, '');
      const approved = s.decision === 'approved';
      const when = s.reviewedAt ? ' on ' + new Date(s.reviewedAt).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
      const b = (t) => Object.assign(document.createElement('b'), { textContent: t });
      pop({
        title: 'Already reviewed', icon: approved ? 'done' : 'no', declined: !approved, next: items.length > 0, home: true,
        text: ['This has been reviewed by ', b(s.reviewedBy === 'you' ? 'you' : s.reviewedBy || 'a teammate'), when + ': ', b(approved ? 'approved' : 'declined'),
          s.severity != null ? ` (level ${s.severity}).` : '.', ...(s.fileName ? [document.createElement('br'), s.fileName] : [])],
      });
      return true;
    }
    const notStaff = () => { $('stage').hidden = true; pop({ title: 'Staff only', text: 'This page is for Momento staff.', icon: 'lock' }); };

    // ---- Loading ----
    async function load() {
      let user = null;
      const toLogin = () => location.replace('index.html?login=1&next=' + encodeURIComponent('review.html' + location.search));
      try { ({ user } = await momentoApi('/api/auth/me')); } catch (err) {
        if (err.status === 401) return toLogin();
        return pop({ title: 'Can’t reach Momento', text: err.message, icon: 'no', declined: true });
      }
      if (!user) return toLogin();
      if (user.plan !== 'staff') return notStaff();
      let data;
      try { data = await momentoApi('/api/admin/moderation'); }
      catch (err) { return err.status === 404 ? notStaff() : pop({ title: 'Can’t load the photos', text: err.message, icon: 'no', declined: true }); }
      // Oldest first, so nothing waits longer than it has to; the email's photo first if it's still waiting
      items = (data.decisions || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
      const asked = new URLSearchParams(location.search).get('id');
      const at = asked ? items.findIndex((it) => it.id === asked) : -1;
      index = Math.max(0, at);
      if (asked && at < 0 && await alreadyReviewed(asked)) {
        history.replaceState(null, '', location.pathname);
        if (items.length) render(); else { $('stage').hidden = true; $('count').hidden = true; }
        return;
      }
      render();
    }

    $('publish').addEventListener('click', () => decide(true));
    $('keep').addEventListener('click', () => decide(false));
    $('prev').addEventListener('click', () => move(-1));
    $('next').addEventListener('click', () => move(1));
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey || $('pop').open || $('stage').hidden) return;
      const n = Number(e.key);
      if (n >= 1 && n <= 6 && pending == null) { e.preventDefault(); choose(LEVELS[n - 1][0]); }
      else if ((e.key === 'a' || e.key === 'A') && pending != null) decide(true);
      else if ((e.key === 'd' || e.key === 'D') && pending != null) decide(false);
      else if (e.key === 'Escape' && pending != null) { pending = null; render(); }
      else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowLeft') move(-1);
    });
    // New requests arrive by themselves (every 30 seconds), without moving you off the photo on screen
    setInterval(async () => {
      if (document.hidden || busy) return;
      try {
        const { decisions = [] } = await momentoApi('/api/admin/moderation');
        const known = new Set(items.map((it) => it.id));
        const fresh = decisions.filter((d) => !known.has(d.id)).sort((a, b) => new Date(a.at) - new Date(b.at));
        if (!fresh.length) return;
        const wasEmpty = !items.length;
        items = items.concat(fresh);
        if (wasEmpty) { index = 0; if ($('pop').open && $('popTitle').textContent === 'No photos to review') $('pop').close(); }
        say(fresh.length === 1 ? 'A new photo arrived.' : `${fresh.length} new photos arrived.`);
        render();
      } catch { /* tried again in 30 seconds */ }
    }, 30000);
    load();
  })();
  </script>
</body>
</html>
